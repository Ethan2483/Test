<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 500px;
            margin: 50px auto;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>
</html>
